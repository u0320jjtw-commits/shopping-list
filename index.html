<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="月間タスク管理" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icons/icon-192.svg" />
    <title>月間タスク管理</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
        --bg: #f3f6fb;
        --card: #ffffff;
        --text: #1e293b;
        --muted: #64748b;
        --accent: #2563eb;
        --border: #dbe3ee;
        --saturday: #edf6ff;
        --sunday: #fff0f0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: var(--bg);
        color: var(--text);
        -webkit-tap-highlight-color: transparent;
      }

      button,
      input {
        font: inherit;
      }

      button {
        min-height: 42px;
        padding: 9px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
        color: var(--text);
        cursor: pointer;
        touch-action: manipulation;
      }

      button:hover {
        border-color: #a8b7ca;
      }

      button:focus-visible,
      input:focus-visible {
        outline: 3px solid #93c5fd;
        outline-offset: 2px;
      }

      .app {
        width: min(1500px, 100%);
        margin: 0 auto;
        padding: 28px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: var(--card);
        box-shadow: 0 12px 32px rgb(30 41 59 / 7%);
      }

      .page-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: clamp(1.5rem, 3vw, 2rem);
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
      }

      .task-form,
      .month-controls {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .task-form {
        margin-bottom: 22px;
      }

      .task-input {
        flex: 1;
        min-width: 0;
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
      }

      .primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
        font-weight: 700;
      }

      .primary:hover {
        border-color: #1d4ed8;
        background: #1d4ed8;
      }

      .month-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
      }

      .month-controls input {
        min-height: 42px;
        padding: 7px 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
        color: var(--text);
      }

      .summary {
        color: var(--muted);
        font-size: 0.95rem;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .legend-swatch {
        width: 14px;
        height: 14px;
        border: 1px solid var(--border);
        border-radius: 4px;
      }

      .legend-swatch.saturday {
        background: var(--saturday);
      }

      .legend-swatch.sunday {
        background: var(--sunday);
      }

      .table-scroll {
        overflow: auto;
        max-height: min(70vh, 760px);
        border: 1px solid var(--border);
        border-radius: 12px;
        overscroll-behavior: contain;
      }

      table {
        width: max-content;
        min-width: 100%;
        border-spacing: 0;
        border-collapse: separate;
        font-size: 0.9rem;
      }

      th,
      td {
        height: 54px;
        padding: 6px;
        border-right: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
        text-align: center;
      }

      thead th {
        position: sticky;
        top: 0;
        z-index: 2;
        height: 62px;
        background: #f8fafc;
      }

      th:first-child,
      td:first-child {
        position: sticky;
        left: 0;
        z-index: 1;
        width: 240px;
        min-width: 240px;
        text-align: left;
      }

      thead th:first-child {
        z-index: 3;
        background: #f8fafc;
      }

      tbody th {
        background: #fff;
        font-weight: 400;
      }

      tr:last-child th,
      tr:last-child td {
        border-bottom: 0;
      }

      th:last-child,
      td:last-child {
        border-right: 0;
      }

      .date-column {
        width: 48px;
        min-width: 48px;
      }

      .saturday {
        background: var(--saturday);
      }

      .sunday {
        background: var(--sunday);
      }

      .date-number {
        display: block;
        font-weight: 700;
      }

      .weekday {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 0.74rem;
        font-weight: 400;
      }

      .today .date-number {
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .task-row-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .task-name {
        overflow-wrap: anywhere;
        font-weight: 600;
      }

      .task-progress {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.76rem;
      }

      .delete-task {
        flex: 0 0 auto;
        min-height: 32px;
        padding: 3px 8px;
        border: 0;
        background: transparent;
        color: #b91c1c;
        font-size: 1.2rem;
      }

      .status-toggle {
        display: inline-grid;
        width: 32px;
        height: 32px;
        min-height: 32px;
        place-items: center;
        padding: 0;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: rgb(255 255 255 / 75%);
        color: #fff;
        font-size: 1rem;
        font-weight: 700;
      }

      .status-toggle[aria-pressed="true"] {
        border-color: #15803d;
        background: #16a34a;
      }

      .empty-cell {
        padding: 28px;
        color: var(--muted);
        text-align: center !important;
      }

      .storage-message {
        margin: 12px 0 0;
        color: #b91c1c;
        font-size: 0.9rem;
      }

      .storage-message[hidden] {
        display: none;
      }

      @media (max-width: 640px) {
        body {
          padding: max(12px, env(safe-area-inset-top)) 8px max(12px, env(safe-area-inset-bottom));
        }

        .app {
          padding: 18px 12px;
          border-radius: 14px;
        }

        .page-header,
        .month-bar {
          align-items: flex-start;
          flex-direction: column;
        }

        .task-form {
          flex-wrap: wrap;
        }

        .task-input {
          flex-basis: 100%;
        }

        th:first-child,
        td:first-child {
          width: 180px;
          min-width: 180px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="page-header">
        <div>
          <h1>月間タスク管理</h1>
          <p class="subtitle">タスクごとに、毎日の実施状況を記録できます。</p>
        </div>
      </header>

      <form id="task-form" class="task-form">
        <input
          id="task-input"
          class="task-input"
          type="text"
          maxlength="80"
          placeholder="タスク名を入力（例: 運動、読書）"
          aria-label="タスク名"
          autocomplete="off"
          required
        />
        <button class="primary" type="submit">タスクを追加</button>
      </form>

      <section aria-label="月間タスク表">
        <div class="month-bar">
          <div class="month-controls">
            <button id="previous-month" type="button" aria-label="前の月">‹ 前月</button>
            <label>
              <span class="visually-hidden">表示する月</span>
              <input id="month-picker" type="month" aria-label="表示する月" />
            </label>
            <button id="next-month" type="button" aria-label="次の月">翌月 ›</button>
            <button id="current-month" type="button">今月</button>
          </div>
          <div id="summary" class="summary" aria-live="polite"></div>
        </div>

        <div class="legend" aria-label="曜日の色分け">
          <span class="legend-item"><span class="legend-swatch saturday" aria-hidden="true"></span>土曜日</span>
          <span class="legend-item"><span class="legend-swatch sunday" aria-hidden="true"></span>日曜日</span>
          <span>日付のマスを押すと実施済みにできます。</span>
        </div>

        <div class="table-scroll" tabindex="0" aria-label="横にスクロールできる月間タスク表">
          <table id="task-table">
            <caption id="table-caption" class="visually-hidden"></caption>
            <thead id="table-head"></thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </section>
      <p id="storage-message" class="storage-message" role="alert" hidden>
        変更を保存できませんでした。ブラウザーのストレージ設定を確認してください。
      </p>
    </main>

    <style>
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        clip-path: inset(50%);
      }
    </style>

    <script>
      const STORAGE_KEY = "monthly-task-tracker-v1";
      const LEGACY_STORAGE_KEY = "task-list-items-v3";
      const weekdays = ["日", "月", "火", "水", "木", "金", "土"];
      const form = document.getElementById("task-form");
      const taskInput = document.getElementById("task-input");
      const monthPicker = document.getElementById("month-picker");
      const tableHead = document.getElementById("table-head");
      const tableBody = document.getElementById("table-body");
      const summary = document.getElementById("summary");
      const storageMessage = document.getElementById("storage-message");
      let state = loadState();

      monthPicker.value = monthKey(new Date());

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const name = taskInput.value.trim();
        if (!name) {
          taskInput.focus();
          return;
        }

        state.tasks.push({ id: createId(), name });
        persistState();
        render();
        taskInput.value = "";
        taskInput.focus();
      });

      document.getElementById("previous-month").addEventListener("click", () => shiftMonth(-1));
      document.getElementById("next-month").addEventListener("click", () => shiftMonth(1));
      document.getElementById("current-month").addEventListener("click", () => {
        monthPicker.value = monthKey(new Date());
        render();
      });
      monthPicker.addEventListener("change", render);

      tableBody.addEventListener("click", (event) => {
        const deleteButton = event.target.closest("[data-delete-id]");
        if (deleteButton) {
          const taskId = deleteButton.dataset.deleteId;
          state.tasks = state.tasks.filter((task) => task.id !== taskId);
          Object.keys(state.completed).forEach((date) => {
            state.completed[date] = state.completed[date].filter((id) => id !== taskId);
            if (state.completed[date].length === 0) delete state.completed[date];
          });
          persistState();
          render();
          return;
        }

        const statusButton = event.target.closest("[data-date][data-task-id]");
        if (!statusButton) return;
        const { date, taskId } = statusButton.dataset;
        const completedIds = state.completed[date] || [];
        state.completed[date] = completedIds.includes(taskId)
          ? completedIds.filter((id) => id !== taskId)
          : [...completedIds, taskId];
        if (state.completed[date].length === 0) delete state.completed[date];
        persistState();
        render();
      });

      function loadState() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (stored !== null) return normalizeState(JSON.parse(stored));

          const legacy = localStorage.getItem(LEGACY_STORAGE_KEY);
          if (legacy !== null) {
            const migrated = normalizeState({
              tasks: JSON.parse(legacy),
              completed: {},
            });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
            return migrated;
          }
        } catch (error) {
          console.warn("保存済みのタスクを読み込めませんでした。", error);
        }
        return { tasks: [], completed: {} };
      }

      function normalizeState(source) {
        const tasks = (Array.isArray(source?.tasks) ? source.tasks : [])
          .map((task, index) => {
            if (typeof task === "string") {
              return { id: `legacy-${index}`, name: task.trim() };
            }
            return {
              id: String(task?.id ?? `task-${index}`),
              name: String(task?.name ?? "").trim(),
            };
          })
          .filter((task) => task.name);
        const completed = {};
        if (source?.completed && typeof source.completed === "object" && !Array.isArray(source.completed)) {
          Object.entries(source.completed).forEach(([date, ids]) => {
            if (/^\d{4}-\d{2}-\d{2}$/.test(date) && Array.isArray(ids)) {
              completed[date] = ids.map(String);
            }
          });
        }
        return { tasks, completed };
      }

      function persistState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          storageMessage.hidden = true;
        } catch (error) {
          storageMessage.hidden = false;
          console.warn("タスクの変更を保存できませんでした。", error);
        }
      }

      function createId() {
        return globalThis.crypto?.randomUUID?.() ?? `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      }

      function monthKey(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
      }

      function shiftMonth(amount) {
        const [year, month] = monthPicker.value.split("-").map(Number);
        monthPicker.value = monthKey(new Date(year, month - 1 + amount, 1));
        render();
      }

      function formatDate(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      }

      function render() {
        const [year, month] = monthPicker.value.split("-").map(Number);
        if (!year || !month) return;

        const daysInMonth = new Date(year, month, 0).getDate();
        const dates = Array.from({ length: daysInMonth }, (_, index) => new Date(year, month - 1, index + 1));
        const monthLabel = new Intl.DateTimeFormat("ja-JP", { year: "numeric", month: "long" }).format(
          new Date(year, month - 1, 1)
        );
        const completedCount = state.tasks.reduce(
          (total, task) => total + dates.filter((date) => (state.completed[formatDate(date)] || []).includes(task.id)).length,
          0
        );
        const possibleCount = state.tasks.length * daysInMonth;
        const percentage = possibleCount === 0 ? 0 : Math.round((completedCount / possibleCount) * 100);
        summary.textContent = `${state.tasks.length}タスク · 実施 ${completedCount}/${possibleCount}回 (${percentage}%)`;
        document.getElementById("table-caption").textContent = `${monthLabel}のタスク実施状況`;

        tableHead.innerHTML = `
          <tr>
            <th scope="col">タスク</th>
            ${dates.map(renderDateHeading).join("")}
          </tr>
        `;

        if (state.tasks.length === 0) {
          tableBody.innerHTML = `<tr><td class="empty-cell" colspan="${daysInMonth + 1}">タスクを追加すると、日ごとの実施状況を記録できます。</td></tr>`;
          return;
        }

        tableBody.innerHTML = state.tasks.map((task) => renderTaskRow(task, dates)).join("");
      }

      function renderDateHeading(date) {
        const weekday = date.getDay();
        const className = weekday === 6 ? "saturday" : weekday === 0 ? "sunday" : "";
        const today = formatDate(date) === formatDate(new Date()) ? "today" : "";
        return `
          <th class="date-column ${className} ${today}" scope="col">
            <span class="date-number">${date.getDate()}</span>
            <span class="weekday">${weekdays[weekday]}</span>
          </th>
        `;
      }

      function renderTaskRow(task, dates) {
        const completedDays = dates.filter((date) => (state.completed[formatDate(date)] || []).includes(task.id)).length;
        return `
          <tr>
            <th scope="row">
              <div class="task-row-heading">
                <div>
                  <span class="task-name">${escapeHtml(task.name)}</span>
                  <span class="task-progress">${completedDays}/${dates.length}日 実施</span>
                </div>
                <button
                  class="delete-task"
                  data-delete-id="${escapeHtml(task.id)}"
                  type="button"
                  aria-label="${escapeHtml(task.name)}を削除"
                  title="タスクを削除"
                >×</button>
              </div>
            </th>
            ${dates.map((date) => renderStatusCell(task, date)).join("")}
          </tr>
        `;
      }

      function renderStatusCell(task, date) {
        const dateKey = formatDate(date);
        const weekday = date.getDay();
        const dayClass = weekday === 6 ? "saturday" : weekday === 0 ? "sunday" : "";
        const done = (state.completed[dateKey] || []).includes(task.id);
        const status = done ? "実施済み" : "未実施";
        return `
          <td class="${dayClass}">
            <button
              class="status-toggle"
              type="button"
              data-date="${dateKey}"
              data-task-id="${escapeHtml(task.id)}"
              aria-pressed="${done}"
              aria-label="${escapeHtml(task.name)}、${date.getMonth() + 1}月${date.getDate()}日、${status}"
              title="${status}"
            >${done ? "✓" : ""}</button>
          </td>
        `;
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      render();

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch((error) => {
            console.warn("Service Worker の登録に失敗しました。", error);
          });
        });
      }
    </script>
  </body>
</html>
