<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ff7f50" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="月間タスク管理" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icons/icon-192.svg" />
    <title>月間タスク管理</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
        --bg: #fff8e7;
        --card: #fff;
        --text: #453b66;
        --muted: #817997;
        --accent: #ff7f50;
        --border: #f0dfd2;
        --saturday: #e8f7ff;
        --sunday: #fff0f3;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: max(10px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom));
        background: var(--bg);
        color: var(--text);
        -webkit-tap-highlight-color: transparent;
        background-image: radial-gradient(#ffdba8 1px, transparent 1px);
        background-size: 18px 18px;
      }

      button, input, select { font: inherit; }

      button {
        min-height: 32px;
        padding: 5px 10px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #fff;
        color: var(--text);
        cursor: pointer;
        touch-action: manipulation;
        box-shadow: 0 2px 0 rgb(69 59 102 / 7%);
      }

      button:hover { border-color: #f5a27f; transform: translateY(-1px); }
      button:focus-visible, input:focus-visible, select:focus-visible {
        outline: 3px solid #93c5fd;
        outline-offset: 2px;
      }

      .app {
        width: min(1500px, 100%);
        margin: 0 auto;
        padding: 14px;
        border: 2px solid #ffe2b9;
        border-radius: 22px;
        background: var(--card);
        box-shadow: 0 8px 22px rgb(109 78 56 / 10%);
      }

      .page-header, .month-bar, .month-controls, .allowance-card, .task-row-heading, .table-footer {
        display: flex;
        align-items: center;
      }

      .page-header, .month-bar { justify-content: space-between; gap: 10px; }
      .page-header { margin-bottom: 8px; }
      h1 { margin: 0 0 2px; color: #6c58a8; font-size: clamp(1.25rem, 2.3vw, 1.65rem); }
      .subtitle { margin: 0; color: var(--muted); }
      .allowance-card {
        flex: 0 0 auto;
        flex-direction: column;
        align-items: flex-end;
        gap: 1px;
        padding: 5px 12px;
        border: 2px solid #ffe0a8;
        border-radius: 16px;
        background: #fff7d9;
      }
      .allowance-label { color: #a96d00; font-size: 0.72rem; font-weight: 700; }
      .allowance-amount { color: #e07820; font-size: 1.25rem; font-weight: 800; }
      .allowance-details { display: grid; gap: 1px; color: var(--muted); font-size: 0.66rem; text-align: right; }
      .month-bar { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); margin-bottom: 6px; }
      .month-controls { grid-column: 2; gap: 10px; }
      .month-controls input {
        min-height: 32px;
        padding: 4px 8px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
        color: var(--text);
      }
      .month-title { min-width: 130px; margin: 0; color: #6c58a8; font-size: 1.1rem; text-align: center; }
      .summary { grid-column: 3; justify-self: end; color: var(--muted); font-size: 0.75rem; }
      .legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 6px; color: var(--muted); font-size: 0.7rem; }
      .legend-item { display: inline-flex; align-items: center; gap: 6px; }
      .legend-swatch { width: 14px; height: 14px; border: 1px solid var(--border); border-radius: 4px; }
      .legend-swatch.saturday { background: var(--saturday); }
      .legend-swatch.sunday { background: var(--sunday); }
      .table-scroll {
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 14px;
      }

      table {
        width: 100%;
        table-layout: fixed;
        border-spacing: 0;
        border-collapse: separate;
        font-size: clamp(0.55rem, 0.82vw, 0.76rem);
      }
      th, td {
        height: 30px;
        padding: 2px 1px;
        border-right: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
        text-align: center;
      }
      thead th { height: 34px; background: #fff8e9; }
      th:first-child, td:first-child {
        width: 150px;
        text-align: left;
      }
      thead th:first-child { background: #fff8e9; }
      tbody th { background: #fff; font-weight: 400; }
      th:last-child, td:last-child { border-right: 0; }
      .date-column { font-size: 0.68rem; }
      .total-column { width: 38px; background: #fff8e9; font-weight: 700; }
      .saturday { background: var(--saturday); }
      .sunday { background: var(--sunday); }
      .date-number { display: block; font-weight: 700; }
      .weekday { display: block; color: var(--muted); font-size: 0.56rem; font-weight: 400; }
      .today .date-number { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
      .task-row-heading { justify-content: space-between; gap: 10px; }
      .task-name {
        display: flex;
        align-items: center;
        gap: 4px;
        overflow-wrap: anywhere;
        font-weight: 600;
      }
      .category-tag { flex: 0 0 auto; padding: 1px 4px; border-radius: 6px; background: var(--category-color); color: #fff; font-size: 0.58rem; }
      .delete-task { flex: 0 0 auto; min-height: 22px; padding: 0 4px; border: 0; background: transparent; color: #ed6a7b; font-size: 0.95rem; box-shadow: none; }
      .cell-button {
        display: grid;
        width: 100%;
        height: 25px;
        min-height: 25px;
        place-items: center;
        padding: 0;
        border-color: transparent;
        background: transparent;
        font-size: 0.72rem;
        font-weight: 700;
        box-shadow: none;
      }
      .cell-button:hover { border-color: #ffc5a8; background: rgb(255 255 255 / 80%); }
      .cell-button.done { color: #28a875; font-size: 0.95rem; }
      .cell-button.number-value { color: #6c58a8; }
      .subtotal-row th, .subtotal-row td { background: #f7f0ff; font-weight: 700; }
      .grand-total { background: #eee6ff !important; color: #6c58a8; font-weight: 800 !important; }
      .empty-cell { padding: 12px; color: var(--muted); text-align: center !important; }
      .table-footer { justify-content: center; gap: 8px; margin-top: 8px; }
      .primary { border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 700; }
      .primary:hover { border-color: #ed7044; background: #ed7044; }
      .secondary { border-color: #b6a9e3; background: #f2edff; color: #6c58a8; font-weight: 700; }
      .view[hidden] { display: none; }
      .view-controls { display: flex; justify-content: center; gap: 8px; margin-bottom: 6px; }
      .secondary[aria-pressed="true"] { border-color: #c9b9f2; background: #eee6ff; }
      .chart-card { padding: 10px; border: 1px solid var(--border); border-radius: 14px; background: #fffdf8; }
      .chart-title { margin: 0 0 5px; color: #6c58a8; font-size: 0.95rem; }
      #monthly-chart { display: block; width: 100%; height: min(52vh, 360px); min-height: 190px; overflow: visible; }
      .chart-legend { display: flex; flex-wrap: wrap; gap: 5px 12px; margin: 8px 0 0; padding: 0; list-style: none; font-size: 0.7rem; }
      .chart-legend li { display: inline-flex; align-items: center; gap: 5px; }
      .chart-swatch { width: 10px; height: 10px; border-radius: 3px; background: var(--category-color); opacity: var(--task-opacity, 1); }
      .chart-empty { padding: 30px; color: var(--muted); text-align: center; }
      .storage-message { margin: 12px 0 0; color: #b91c1c; font-size: 0.9rem; }
      .storage-message[hidden] { display: none; }
      dialog {
        width: min(440px, calc(100% - 32px));
        padding: 18px;
        border: 1px solid var(--border);
        border-radius: 16px;
        color: var(--text);
        box-shadow: 0 20px 60px rgb(15 23 42 / 25%);
      }
      dialog::backdrop { background: rgb(15 23 42 / 42%); }
      dialog h2 { margin: 0 0 18px; font-size: 1.25rem; }
      .dialog-fields { display: grid; gap: 10px; }
      .dialog-fields label { display: grid; gap: 6px; font-weight: 600; }
      .dialog-fields select, .dialog-fields input {
        width: 100%;
        min-height: 38px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: #fff;
        color: var(--text);
      }
      .dialog-hint { margin: 0; color: var(--muted); font-size: 0.9rem; }
      .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

      @media (max-width: 640px) {
        body { padding: max(6px, env(safe-area-inset-top)) 4px max(6px, env(safe-area-inset-bottom)); }
        .app { padding: 8px 5px; border-radius: 14px; }
        .page-header { align-items: flex-start; flex-direction: column; }
        .page-header { gap: 6px; }
        .allowance-card { align-items: flex-start; }
        .allowance-details { text-align: left; }
        .month-bar { display: flex; flex-direction: column; gap: 8px; }
        .month-controls { width: 100%; justify-content: center; gap: 5px; }
        .month-controls button { padding: 8px; }
        .month-title { min-width: 0; font-size: 1.08rem; }
        th:first-child, td:first-child { width: 76px; }
        .task-row-heading { gap: 0; }
        .task-name { gap: 2px; font-size: 0.58rem; }
        .category-tag { max-width: 31px; overflow: hidden; text-overflow: ellipsis; }
        .delete-task { font-size: 0.75rem; }
        .month-controls { gap: 3px; }
        .month-controls button { min-height: 28px; padding: 3px 5px; font-size: 0.7rem; }
        .month-title { min-width: 88px; font-size: 0.9rem; }
        .date-column { font-size: 0.55rem; }
        .weekday { font-size: 0.48rem; }
        th, td { height: 27px; padding: 1px 0; }
        thead th { height: 30px; }
        .cell-button { height: 23px; min-height: 23px; font-size: 0.6rem; }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="page-header">
        <div>
          <h1>月間タスク管理</h1>
          <p class="subtitle">毎日のがんばりを記録して、お小遣いを確認しよう！</p>
        </div>
        <div class="allowance-card" aria-live="polite">
          <span id="allowance-label" class="allowance-label">選択月のお小遣い</span>
          <span id="allowance" class="allowance-amount">0円</span>
          <div class="allowance-details">
            <span id="allowance-estimate">選択月の見込み額 —円</span>
            <span id="allowance-comparison">先月比 —</span>
          </div>
        </div>
      </header>

      <section aria-label="月間タスク表とデータ">
        <div class="month-bar">
          <div class="month-controls">
            <button id="previous-month" type="button" aria-label="前の月">‹ 前月</button>
            <h2 id="month-title" class="month-title" aria-live="polite"></h2>
            <button id="next-month" type="button" aria-label="次の月">翌月 ›</button>
          </div>
          <div id="summary" class="summary" aria-live="polite"></div>
        </div>

        <div class="view-controls" role="group" aria-label="表示切り替え">
          <button id="show-table" class="secondary" type="button" aria-pressed="true">📝 タスク</button>
          <button id="show-data" class="secondary" type="button" aria-pressed="false">📊 データ</button>
        </div>

        <div id="table-view" class="view">
        <div class="legend" aria-label="曜日と入力方法">
          <span class="legend-item"><span class="legend-swatch saturday" aria-hidden="true"></span>土曜日</span>
          <span class="legend-item"><span class="legend-swatch sunday" aria-hidden="true"></span>日曜日</span>
          <span>マスを押して記録します。実施1回につき10円です。</span>
        </div>

        <div class="table-scroll" aria-label="月間タスク表">
          <table id="task-table">
            <caption id="table-caption" class="visually-hidden"></caption>
            <thead id="table-head"></thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
        <div class="table-footer">
          <button id="open-add-task" class="primary" type="button">＋ タスク追加</button>
        </div>
        </div>

        <div id="data-view" class="view" hidden>
          <div class="chart-card">
            <h3 id="chart-heading" class="chart-title">月別のタスク実施状況</h3>
            <div id="chart-content"></div>
          </div>
        </div>
      </section>
      <p id="storage-message" class="storage-message" role="alert" hidden>
        変更を保存できませんでした。ブラウザーのストレージ設定を確認してください。
      </p>
    </main>

    <dialog id="add-dialog" aria-labelledby="add-dialog-title">
      <form id="add-form">
        <h2 id="add-dialog-title">タスク追加</h2>
        <div class="dialog-fields">
          <label>大カテゴリ
            <input id="category-input" type="text" list="category-options" maxlength="30" required placeholder="例：おてつだい" />
            <datalist id="category-options"></datalist>
          </label>
          <label>小カテゴリ
            <input id="subcategory-input" type="text" maxlength="40" required placeholder="例：おさらあらい" />
          </label>
          <label>タスク種別
            <select id="type-select" required>
              <option value="boolean">やった／やってない（○）</option>
              <option value="count">回数を数字で入力</option>
            </select>
          </label>
          <p id="type-hint" class="dialog-hint"></p>
        </div>
        <div class="dialog-actions">
          <button id="cancel-add" type="button">キャンセル</button>
          <button id="submit-add" class="primary" type="submit">追加</button>
        </div>
      </form>
    </dialog>

    <dialog id="value-dialog" aria-labelledby="value-dialog-title">
      <form id="value-form">
        <h2 id="value-dialog-title">実施状況を入力</h2>
        <div class="dialog-fields">
          <label id="value-label" for="value-input">回数</label>
          <input id="value-input" type="number" min="0" step="1" inputmode="numeric" />
          <p id="value-hint" class="dialog-hint"></p>
        </div>
        <div class="dialog-actions">
          <button id="clear-value" type="button">記録を消す</button>
          <button id="cancel-value" type="button">キャンセル</button>
          <button class="primary" type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <style>
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        clip-path: inset(50%);
      }
    </style>

    <script>
      const STORAGE_KEY = "monthly-task-tracker-v1";
      const LEGACY_STORAGE_KEY = "task-list-items-v3";
      const weekdays = ["日", "月", "火", "水", "木", "金", "土"];
      const DEFAULT_CATEGORIES = {
        さんすう: { けいさん: "boolean", ぶんしょう: "count", はってん: "boolean" },
        こくご: { おんどく: "boolean", どっかい: "count", かんじ: "boolean" },
        そのた: { せんたく: "boolean", ランニング: "boolean", おえかき: "boolean" },
      };
      const CATEGORY_COLORS = ["#ff8a65", "#5bb7d3", "#a78bdb", "#69bd87", "#f2b84b", "#ed7da8", "#7389e8", "#9aa64c"];
      const categoryInput = document.getElementById("category-input");
      const subcategoryInput = document.getElementById("subcategory-input");
      const typeSelect = document.getElementById("type-select");
      const addDialog = document.getElementById("add-dialog");
      const valueDialog = document.getElementById("value-dialog");
      const monthTitle = document.getElementById("month-title");
      const tableHead = document.getElementById("table-head");
      const tableBody = document.getElementById("table-body");
      const summary = document.getElementById("summary");
      const storageMessage = document.getElementById("storage-message");
      let state = loadState();
      let categories = state.categories;
      let editingCell = null;

      updateCategoryOptions();

      document.getElementById("open-add-task").addEventListener("click", () => {
        categoryInput.value = "";
        subcategoryInput.value = "";
        typeSelect.value = "boolean";
        updateCategoryOptions();
        updateTaskType();
        addDialog.showModal();
      });
      document.getElementById("cancel-add").addEventListener("click", () => addDialog.close());
      typeSelect.addEventListener("change", updateTaskType);
      categoryInput.addEventListener("input", () => categoryInput.setCustomValidity(""));
      subcategoryInput.addEventListener("input", () => subcategoryInput.setCustomValidity(""));
      document.getElementById("previous-month").addEventListener("click", () => shiftMonth(-1));
      document.getElementById("next-month").addEventListener("click", () => shiftMonth(1));
      document.getElementById("show-table").addEventListener("click", () => switchView("table"));
      document.getElementById("show-data").addEventListener("click", () => switchView("data"));

      document.getElementById("add-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const category = categoryInput.value.trim();
        const subcategory = subcategoryInput.value.trim();
        const type = typeSelect.value;
        if (!category || !subcategory || !["boolean", "count"].includes(type)) return;
        if (state.tasks.some((task) => task.category === category && task.subcategory === subcategory)) {
          subcategoryInput.setCustomValidity("この小カテゴリはすでに追加されています。");
          subcategoryInput.reportValidity();
          return;
        }

        if (!categories[category]) categories[category] = Object.create(null);
        categories[category][subcategory] = type;
        state.tasks.push({
          id: createId(),
          category,
          subcategory,
          type,
        });
        updateCategoryOptions();
        persistState();
        addDialog.close();
        render();
      });

      tableBody.addEventListener("click", (event) => {
        const deleteButton = event.target.closest("[data-delete-id]");
        if (deleteButton) {
          const taskId = deleteButton.dataset.deleteId;
          state.tasks = state.tasks.filter((task) => task.id !== taskId);
          Object.values(state.values).forEach((dayValues) => delete dayValues[taskId]);
          Object.keys(state.values).forEach((date) => {
            if (Object.keys(state.values[date]).length === 0) delete state.values[date];
          });
          persistState();
          render();
          return;
        }

        const cellButton = event.target.closest("[data-date][data-task-id]");
        if (!cellButton) return;
        const task = state.tasks.find((item) => item.id === cellButton.dataset.taskId);
        if (!task) return;
        const date = cellButton.dataset.date;
        if (task.type === "boolean") {
          const dayValues = state.values[date] || {};
          if (dayValues[task.id] === 1) {
            delete dayValues[task.id];
            if (Object.keys(dayValues).length === 0) delete state.values[date];
            else state.values[date] = dayValues;
          } else {
            state.values[date] = { ...dayValues, [task.id]: 1 };
          }
          persistState();
          render();
          return;
        }
        openValueDialog(task, date);
      });

      document.getElementById("cancel-value").addEventListener("click", () => valueDialog.close());
      document.getElementById("clear-value").addEventListener("click", () => {
        if (!editingCell) return;
        removeValue(editingCell.taskId, editingCell.date);
        valueDialog.close();
        persistState();
        render();
      });
      document.getElementById("value-form").addEventListener("submit", (event) => {
        event.preventDefault();
        if (!editingCell) return;
        const input = document.getElementById("value-input");
        if (input.value === "" || !Number.isSafeInteger(Number(input.value)) || Number(input.value) < 0) {
          input.setCustomValidity("0以上の整数を入力してください。");
          input.reportValidity();
          return;
        }
        input.setCustomValidity("");
        const value = Number(input.value);
        if (value === 0) removeValue(editingCell.taskId, editingCell.date);
        else {
          state.values[editingCell.date] = {
            ...(state.values[editingCell.date] || {}),
            [editingCell.taskId]: value,
          };
        }
        valueDialog.close();
        persistState();
        render();
      });

      function updateCategoryOptions() {
        document.getElementById("category-options").innerHTML = Object.keys(categories)
          .map((category) => `<option value="${escapeHtml(category)}"></option>`).join("");
        updateTaskType();
      }

      function updateTaskType() {
        document.getElementById("type-hint").textContent =
          typeSelect.value === "boolean" ? "「やった／やってない」で記録します。" : "実施した回数を数字で記録します。";
      }

      function switchView(view) {
        const showData = view === "data";
        document.getElementById("table-view").hidden = showData;
        document.getElementById("data-view").hidden = !showData;
        document.getElementById("show-table").setAttribute("aria-pressed", String(!showData));
        document.getElementById("show-data").setAttribute("aria-pressed", String(showData));
        render();
      }

      function openValueDialog(task, date) {
        editingCell = { taskId: task.id, date };
        const input = document.getElementById("value-input");
        const value = state.values[date]?.[task.id] || 0;
        document.getElementById("value-dialog-title").textContent = `${task.subcategory}：回数を入力`;
        document.getElementById("value-label").textContent = `${Number(date.slice(5, 7))}月${Number(date.slice(8, 10))}日の回数`;
        document.getElementById("value-hint").textContent = "0を入力するか「記録を消す」を選ぶと、記録を解除します。";
        input.value = value === 0 ? "" : String(value);
        input.setCustomValidity("");
        valueDialog.showModal();
        input.focus();
      }

      function removeValue(taskId, date) {
        if (!state.values[date]) return;
        delete state.values[date][taskId];
        if (Object.keys(state.values[date]).length === 0) delete state.values[date];
      }

      function loadState() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (stored !== null) return normalizeState(JSON.parse(stored));

          const legacy = localStorage.getItem(LEGACY_STORAGE_KEY);
          if (legacy !== null) {
            const legacyTasks = JSON.parse(legacy);
            const migrated = normalizeState({
              tasks: [...createDefaultTasks(), ...(Array.isArray(legacyTasks) ? legacyTasks : [])],
              completed: {},
            });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
            return migrated;
          }
        } catch (error) {
          console.warn("保存済みのタスクを読み込めませんでした。", error);
        }
        return normalizeState({ tasks: createDefaultTasks(), values: {} });
      }

      function normalizeState(source) {
        const definitions = Object.create(null);
        Object.entries(DEFAULT_CATEGORIES).forEach(([category, subcategories]) => {
          definitions[category] = Object.assign(Object.create(null), subcategories);
        });
        if (source?.categories && typeof source.categories === "object" && !Array.isArray(source.categories)) {
          Object.entries(source.categories).forEach(([rawCategory, subcategories]) => {
            const category = rawCategory.trim();
            if (!category || !subcategories || typeof subcategories !== "object" || Array.isArray(subcategories)) return;
            if (!definitions[category]) definitions[category] = Object.create(null);
            Object.entries(subcategories).forEach(([rawSubcategory, type]) => {
              const subcategory = rawSubcategory.trim();
              if (subcategory && (type === "boolean" || type === "count")) definitions[category][subcategory] = type;
            });
          });
        }
        const tasks = (Array.isArray(source?.tasks) ? source.tasks : [])
          .map((task, index) => {
            if (typeof task === "string") {
              return { id: `legacy-${index}`, category: "そのた", subcategory: task.trim(), type: "boolean" };
            }
            const category = String(task?.category ?? "そのた");
            const subcategory = String(task?.subcategory ?? task?.name ?? "").trim();
            const type = task?.type === "count" ? "count" : "boolean";
            if (!definitions[category]) definitions[category] = Object.create(null);
            if (subcategory && !definitions[category][subcategory]) definitions[category][subcategory] = type;
            return {
              id: String(task?.id ?? `task-${index}`),
              category,
              subcategory,
              type: definitions[category][subcategory] || type,
            };
          })
          .filter((task) => task.subcategory);
        const values = {};
        if (source?.values && typeof source.values === "object" && !Array.isArray(source.values)) {
          Object.entries(source.values).forEach(([date, records]) => {
            if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !records || typeof records !== "object" || Array.isArray(records)) return;
            const dayValues = {};
            Object.entries(records).forEach(([id, value]) => {
              const number = Number(value);
              if (Number.isSafeInteger(number) && number > 0) dayValues[id] = number;
            });
            if (Object.keys(dayValues).length > 0) values[date] = dayValues;
          });
        } else if (source?.completed && typeof source.completed === "object" && !Array.isArray(source.completed)) {
          Object.entries(source.completed).forEach(([date, ids]) => {
            if (/^\d{4}-\d{2}-\d{2}$/.test(date) && Array.isArray(ids) && ids.length > 0) {
              values[date] = Object.fromEntries(ids.map(String).map((id) => [id, 1]));
            }
          });
        }
        return { tasks, values, categories: definitions };
      }

      function createDefaultTasks() {
        return Object.entries(DEFAULT_CATEGORIES).flatMap(([category, subcategories]) =>
          Object.entries(subcategories).map(([subcategory, type]) => ({
            id: `default-${category}-${subcategory}`,
            category,
            subcategory,
            type,
          })));
      }

      function persistState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          storageMessage.hidden = true;
        } catch (error) {
          storageMessage.hidden = false;
          console.warn("タスクの変更を保存できませんでした。", error);
        }
      }

      function createId() {
        return globalThis.crypto?.randomUUID?.() ?? `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      }

      function monthKey(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
      }

      function selectedMonth() {
        const value = new URLSearchParams(window.location.search).get("month");
        return /^\d{4}-\d{2}$/.test(value || "") ? value : monthKey(new Date());
      }

      function shiftMonth(amount) {
        const [year, month] = selectedMonth().split("-").map(Number);
        const next = new Date(year, month - 1 + amount, 1);
        const url = new URL(window.location.href);
        url.searchParams.set("month", monthKey(next));
        window.history.replaceState(null, "", url);
        render();
      }

      function formatDate(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      }

      function valueFor(date, taskId) {
        return state.values[date]?.[taskId] || 0;
      }

      function render() {
        const [year, month] = selectedMonth().split("-").map(Number);
        if (!year || month < 1 || month > 12) return;
        const dates = Array.from({ length: new Date(year, month, 0).getDate() }, (_, index) => new Date(year, month - 1, index + 1));
        const monthLabel = new Intl.DateTimeFormat("ja-JP", { year: "numeric", month: "long" }).format(new Date(year, month - 1, 1));
        const allValues = dates.flatMap((date) => state.tasks.map((task) => valueFor(formatDate(date), task.id)));
        const earned = allValues.reduce((total, value) => total + value, 0);
        const possibleCount = state.tasks.reduce((sum, task) => sum + dates.length, 0);
        const recordedCount = allValues.filter((value) => value > 0).length;
        summary.textContent = `${state.tasks.length}タスク · 記録 ${recordedCount}/${possibleCount}件`;
        monthTitle.textContent = monthLabel;
        document.getElementById("allowance").textContent = `${(earned * 10).toLocaleString("ja-JP")}円`;
        document.getElementById("allowance-label").textContent = `${month}月のお小遣い`;
        renderAllowanceDetails(year, month, earned * 10, dates.length);
        document.getElementById("table-caption").textContent = `${monthLabel}のタスク実施状況`;
        tableHead.innerHTML = `<tr>
          <th scope="col">タスク</th>
          ${dates.map(renderDateHeading).join("")}
          <th class="total-column" scope="col">小計</th>
        </tr>`;

        const taskRows = state.tasks.map((task) => renderTaskRow(task, dates)).join("");
        if (state.tasks.length === 0) {
          tableBody.innerHTML = `<tr><td class="empty-cell" colspan="${dates.length + 2}">「タスク追加」から好きなタスクを追加できます。</td></tr>`;
        } else {
          tableBody.innerHTML = taskRows + renderTotals(dates);
        }
        renderMonthlyChart(year, month);
      }

      function renderAllowanceDetails(year, month, earned, daysInMonth) {
        const now = new Date();
        const selected = new Date(year, month - 1, 1);
        const current = new Date(now.getFullYear(), now.getMonth(), 1);
        const elapsedDays = selected < current ? daysInMonth : selected.getTime() === current.getTime() ? now.getDate() : 0;
        const estimate = elapsedDays ? Math.round((earned / elapsedDays) * daysInMonth) : null;
        document.getElementById("allowance-estimate").textContent =
          `選択月の見込み額 ${estimate === null ? "—" : `${estimate.toLocaleString("ja-JP")}円`}`;

        const previousMonth = new Date(year, month - 2, 1);
        const previousAllowance = calculateMonthAllowance(previousMonth.getFullYear(), previousMonth.getMonth() + 1);
        const difference = earned - previousAllowance;
        const formattedDifference = `${difference > 0 ? "+" : ""}${difference.toLocaleString("ja-JP")}円`;
        const percentage = previousAllowance === 0
          ? (earned === 0 ? "0%" : "算出不可")
          : `${difference > 0 ? "+" : ""}${Math.round((difference / previousAllowance) * 100)}%`;
        document.getElementById("allowance-comparison").textContent =
          `先月比 ${formattedDifference}・${percentage}（先月 ${previousAllowance.toLocaleString("ja-JP")}円）`;
      }

      function calculateMonthAllowance(year, month) {
        const daysInMonth = new Date(year, month, 0).getDate();
        const earned = state.tasks.reduce((total, task) => {
          for (let day = 1; day <= daysInMonth; day += 1) {
            total += valueFor(formatDate(new Date(year, month - 1, day)), task.id);
          }
          return total;
        }, 0);
        return earned * 10;
      }

      function renderDateHeading(date) {
        const weekday = date.getDay();
        const className = weekday === 6 ? "saturday" : weekday === 0 ? "sunday" : "";
        const today = formatDate(date) === formatDate(new Date()) ? "today" : "";
        return `<th class="date-column ${className} ${today}" scope="col">
          <span class="date-number">${date.getDate()}</span><span class="weekday">${weekdays[weekday]}</span>
        </th>`;
      }

      function renderTaskRow(task, dates) {
        const taskTotal = dates.reduce((total, date) => total + valueFor(formatDate(date), task.id), 0);
        return `<tr style="--category-color:${categoryColor(task.category)}">
          <th scope="row"><div class="task-row-heading"><div>
            <span class="task-name"><span class="category-tag">${escapeHtml(task.category)}</span>${escapeHtml(task.subcategory)}</span>
          </div><button class="delete-task" data-delete-id="${escapeHtml(task.id)}" type="button"
            aria-label="${escapeHtml(task.subcategory)}を削除" title="タスクを削除">×</button></div></th>
          ${dates.map((date) => renderCell(task, date)).join("")}
          <td class="total-column">${taskTotal}</td>
        </tr>`;
      }

      function renderCell(task, date) {
        const dateKey = formatDate(date);
        const value = valueFor(dateKey, task.id);
        const weekday = date.getDay();
        const dayClass = weekday === 6 ? "saturday" : weekday === 0 ? "sunday" : "";
        const isBoolean = task.type === "boolean";
        const display = isBoolean ? (value ? "○" : "") : (value ? String(value) : "－");
        const status = isBoolean ? (value ? "実施済み" : "未実施") : (value ? `${value}回` : "未記録");
        return `<td class="${dayClass}"><button class="cell-button ${isBoolean && value ? "done" : ""} ${!isBoolean && value ? "number-value" : ""}"
          type="button" data-date="${dateKey}" data-task-id="${escapeHtml(task.id)}"
          aria-label="${escapeHtml(task.subcategory)}、${date.getMonth() + 1}月${date.getDate()}日、${status}"
          title="${status}">${display}</button></td>`;
      }

      function renderTotals(dates) {
        const dailyTotals = dates.map((date) =>
          state.tasks.reduce((total, task) => total + valueFor(formatDate(date), task.id), 0));
        const grandTotal = dailyTotals.reduce((total, value) => total + value, 0);
        return `<tr class="subtotal-row">
          <th scope="row">日別小計</th>
          ${dailyTotals.map((value) => `<td>${value}</td>`).join("")}
          <td class="total-column grand-total">${grandTotal}</td>
        </tr>`;
      }

      function categoryColor(category) {
        const index = Object.keys(categories).indexOf(category);
        return CATEGORY_COLORS[(index < 0 ? 0 : index) % CATEGORY_COLORS.length];
      }

      function renderMonthlyChart(year, month) {
        const chartContent = document.getElementById("chart-content");
        const lastMonth = new Date(year, month - 1, 1);
        const months = Array.from({ length: 12 }, (_, index) =>
          new Date(lastMonth.getFullYear(), lastMonth.getMonth() - 11 + index, 1));
        document.getElementById("chart-heading").textContent =
          `月別のタスク実施状況（${monthKey(months[0])}〜${monthKey(lastMonth)}）`;
        if (state.tasks.length === 0) {
          chartContent.innerHTML = '<p class="chart-empty">タスクを追加すると、月ごとの実施状況を見られます。</p>';
          return;
        }

        const valuesByMonth = months.map((monthDate) => {
          const daysInMonth = new Date(monthDate.getFullYear(), monthDate.getMonth() + 1, 0).getDate();
          return state.tasks.map((task) => {
            let total = 0;
            for (let day = 1; day <= daysInMonth; day += 1) {
              total += valueFor(formatDate(new Date(monthDate.getFullYear(), monthDate.getMonth(), day)), task.id);
            }
            return total;
          });
        });
        const monthTotals = valuesByMonth.map((values) => values.reduce((sum, value) => sum + value, 0));
        const maximum = Math.max(1, ...monthTotals);
        const width = 900;
        const height = 320;
        const left = 42;
        const right = 12;
        const top = 20;
        const bottom = 42;
        const plotWidth = width - left - right;
        const plotHeight = height - top - bottom;
        const groupWidth = plotWidth / months.length;
        const barWidth = Math.min(42, groupWidth * 0.62);
        const ticks = [...new Set([0, Math.round(maximum / 2), maximum])];
        const grid = ticks.map((tick) => {
          const y = top + plotHeight - (tick / maximum) * plotHeight;
          return `<line x1="${left}" y1="${y}" x2="${width - right}" y2="${y}" stroke="#eadfef" />
            <text x="${left - 8}" y="${y + 4}" text-anchor="end" fill="#817997" font-size="11">${tick}</text>`;
        }).join("");
        const bars = valuesByMonth.map((values, monthIndex) => {
          const x = left + groupWidth * monthIndex + (groupWidth - barWidth) / 2;
          let y = top + plotHeight;
          const segments = values.map((value, taskIndex) => {
            const segmentHeight = (value / maximum) * plotHeight;
            y -= segmentHeight;
            if (!value) return "";
            const task = state.tasks[taskIndex];
            const opacity = 0.58 + (taskIndex % 4) * 0.14;
            return `<rect x="${x}" y="${y}" width="${barWidth}" height="${segmentHeight}" fill="${categoryColor(task.category)}"
              fill-opacity="${opacity}" stroke="#fffdf8" stroke-width="1">
              <title>${escapeHtml(task.category)}・${escapeHtml(task.subcategory)}: ${value}</title>
            </rect>`;
          }).join("");
          const label = `${months[monthIndex].getMonth() + 1}月`;
          return `<g>${segments}
            <text x="${x + barWidth / 2}" y="${Math.max(top - 4, y - 5)}" text-anchor="middle" fill="#655a7b" font-size="10">${monthTotals[monthIndex]}</text>
            <text x="${x + barWidth / 2}" y="${height - 14}" text-anchor="middle" fill="#817997" font-size="11">${label}</text>
          </g>`;
        }).join("");
        const legend = state.tasks.map((task, index) => {
          const opacity = 0.58 + (index % 4) * 0.14;
          return `<li style="--category-color:${categoryColor(task.category)};--task-opacity:${opacity}">
            <span class="chart-swatch" aria-hidden="true"></span>${escapeHtml(task.category)}・${escapeHtml(task.subcategory)}</li>`;
        }).join("");
        chartContent.innerHTML = `<svg id="monthly-chart" viewBox="0 0 ${width} ${height}" role="img"
          aria-labelledby="chart-svg-title chart-svg-description" preserveAspectRatio="xMidYMid meet">
          <title id="chart-svg-title">${escapeHtml(document.getElementById("chart-heading").textContent)}</title>
          <desc id="chart-svg-description">縦軸は実施数、横軸は月です。棒グラフはタスクごとの実施数を積み上げ、色は大カテゴリを表します。</desc>
          ${grid}${bars}
        </svg><ul class="chart-legend" aria-label="タスクと大カテゴリの色">${legend}</ul>`;
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      render();

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch((error) => {
            console.warn("Service Worker の登録に失敗しました。", error);
          });
        });
      }
    </script>
  </body>
</html>
